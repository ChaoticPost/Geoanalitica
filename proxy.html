<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Геоаналитика</title>
    <script>
      fetch("/", {
        headers: {
          "ngrok-skip-browser-warning": "true"
        }
      })
      .then((res) => res.text())
      .then((html) => {
        document.open();
        document.write(html);
        document.close();
      });
    </script>
  </head>
  <body>
    <p>Загрузка...</p>
  </body>
</html>
